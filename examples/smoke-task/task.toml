# The platform's sample task. It follows Terminal-Bench's task template and ships two correct solutions.
artifacts = ["/app/stats"]

[metadata]
author_name = "anonymous"
author_email = "anonymous"
author_github = "anonymous"
author_organization = ""
category = "Software"
subcategory = "Testing"
tags = ["smoke-test", "debugging"]
expert_time_estimate_hours = 1
oracle_solutions = ["1", "2"]

[verifier]
timeout_sec = 120.0
environment_mode = "separate"

[agent]
timeout_sec = 300.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 2048
gpus = 0
network_mode = "public"
